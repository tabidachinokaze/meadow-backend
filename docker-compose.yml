# meadow 后端部署（cachyos.lan 版）
# 前置：cachyos.lan 上已运行 postgres / redis / rustfs(S3) 服务，本编排只部署 backend。
# 用法：docker compose up -d
# 在 .env 中提供：MEADOW_DB_URL / MEADOW_DB_USER / MEADOW_DB_PASSWORD /
#   MEADOW_REDIS_HOST / MEADOW_REDIS_PASSWORD / MEADOW_S3_HOST / MEADOW_S3_ACCESS_KEY / MEADOW_S3_SECRET_KEY /
#   MEADOW_JWT_SECRET / MEADOW_ENCRYPTION_SECRET / MEADOW_RESEND_API_KEY
services:
  backend:
    build: .
    container_name: meadow-backend
    environment:
      MEADOW_DEVELOPMENT: "false"
      MEADOW_DB_URL: ${MEADOW_DB_URL:?必须设置 MEADOW_DB_URL，如 jdbc:postgresql://postgres.cachyos.lan:5432/meadow}
      MEADOW_DB_USER: ${MEADOW_DB_USER:?必须设置 MEADOW_DB_USER}
      MEADOW_DB_PASSWORD: ${MEADOW_DB_PASSWORD:?必须设置 MEADOW_DB_PASSWORD}
      MEADOW_JWT_SECRET: ${MEADOW_JWT_SECRET:?必须设置 MEADOW_JWT_SECRET}
      MEADOW_ENCRYPTION_SECRET: ${MEADOW_ENCRYPTION_SECRET:?必须设置 MEADOW_ENCRYPTION_SECRET}
      # Redis（cachyos.lan 已有）
      MEADOW_REDIS_HOST: ${MEADOW_REDIS_HOST:-redis.cachyos.lan}
      MEADOW_REDIS_PASSWORD: ${MEADOW_REDIS_PASSWORD:-}
      # S3 / RustFS（cachyos.lan 已有，443 反代）
      MEADOW_S3_HOST: ${MEADOW_S3_HOST:-storage.cachyos.lan}
      MEADOW_S3_ACCESS_KEY: ${MEADOW_S3_ACCESS_KEY:?必须设置 MEADOW_S3_ACCESS_KEY}
      MEADOW_S3_SECRET_KEY: ${MEADOW_S3_SECRET_KEY:?必须设置 MEADOW_S3_SECRET_KEY}
      MEADOW_RESEND_API_KEY: ${MEADOW_RESEND_API_KEY:-}
    ports:
      - "23333:23333"
    restart: unless-stopped
