# meadow 部署（cachyos.lan 版）
# 前置：postgres / redis / rustfs(S3) 已在宿主机运行（端口 5432/6379/9000），本编排只起 backend + frontend。
# backend 通过 host.docker.internal 访问宿主机基础设施；frontend(nginx) 同网络反代 backend。
# 用法：docker compose up -d --build
# 在 .env 中提供（缺省值见下方；生产必须覆盖）：
#   MEADOW_DB_URL / MEADOW_DB_USER / MEADOW_DB_PASSWORD / MEADOW_JWT_SECRET / MEADOW_ENCRYPTION_SECRET /
#   MEADOW_REDIS_HOST / MEADOW_REDIS_PASSWORD / MEADOW_S3_HOST / MEADOW_S3_ACCESS_KEY / MEADOW_S3_SECRET_KEY /
#   MEADOW_RESEND_API_KEY / WEB_PORT
services:
  backend:
    build: .
    container_name: meadow-backend
    extra_hosts:
      # Linux 上让容器能访问宿主机（已运行的 postgres/redis/rustfs）
      - "host.docker.internal:host-gateway"
    environment:
      MEADOW_DEVELOPMENT: "false"
      MEADOW_DB_URL: ${MEADOW_DB_URL:-jdbc:postgresql://host.docker.internal:5432/meadow}
      MEADOW_DB_USER: ${MEADOW_DB_USER:-username}
      MEADOW_DB_PASSWORD: ${MEADOW_DB_PASSWORD:-password}
      MEADOW_JWT_SECRET: ${MEADOW_JWT_SECRET:?必须设置 MEADOW_JWT_SECRET}
      MEADOW_ENCRYPTION_SECRET: ${MEADOW_ENCRYPTION_SECRET:?必须设置 MEADOW_ENCRYPTION_SECRET}
      # Redis（宿主机）
      MEADOW_REDIS_HOST: ${MEADOW_REDIS_HOST:-host.docker.internal}
      MEADOW_REDIS_PASSWORD: ${MEADOW_REDIS_PASSWORD:-}
      # S3 / RustFS（宿主机）
      MEADOW_S3_HOST: ${MEADOW_S3_HOST:-host.docker.internal}
      MEADOW_S3_PORT: ${MEADOW_S3_PORT:-9000}
      MEADOW_S3_SCHEME: ${MEADOW_S3_SCHEME:-http}
      # 公开直链地址（浏览器可达；frp 暴露的公网域名，如 https://storage.你的域名）
      MEADOW_S3_PUBLIC_HOST: ${MEADOW_S3_PUBLIC_HOST:-}
      MEADOW_S3_PUBLIC_PORT: ${MEADOW_S3_PUBLIC_PORT:-0}
      MEADOW_S3_PUBLIC_SCHEME: ${MEADOW_S3_PUBLIC_SCHEME:-}
      MEADOW_S3_ACCESS_KEY: ${MEADOW_S3_ACCESS_KEY:?必须设置 MEADOW_S3_ACCESS_KEY}
      MEADOW_S3_SECRET_KEY: ${MEADOW_S3_SECRET_KEY:?必须设置 MEADOW_S3_SECRET_KEY}
      MEADOW_RESEND_API_KEY: ${MEADOW_RESEND_API_KEY:-}
    ports:
      - "23333:23333"
    restart: unless-stopped

  frontend:
    build:
      context: ../meadow-web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: meadow-frontend
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
