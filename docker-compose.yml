# meadow 部署（cachyos.lan 版）
# 前置：postgres / redis / rustfs(S3) 已在宿主机运行，本编排只起 backend + frontend。
# 网络策略（split-horizon）：
#   - storage.tabidachi.moe:443 = frp 指向 rustfs(192.168.8.111:9000)，公网可访问
#   - 后端也连 storage.tabidachi.moe（签名 host 与浏览器一致），但 extra_hosts 让它解析到内网 IP → 上传走内网不绕公网
# 用法：docker compose up -d --build
# 在 .env 中提供（缺省值见下方；生产必须覆盖）：
#   MEADOW_DB_URL / MEADOW_DB_USER / MEADOW_DB_PASSWORD / MEADOW_JWT_SECRET / MEADOW_ENCRYPTION_SECRET /
#   MEADOW_REDIS_HOST / MEADOW_REDIS_PASSWORD / MEADOW_S3_ACCESS_KEY / MEADOW_S3_SECRET_KEY /
#   MEADOW_RESEND_API_KEY / WEB_PORT / RUSTFS_INTERNAL_IP
services:
  backend:
    build: .
    container_name: meadow-backend
    extra_hosts:
      # split-horizon：公网域名在容器内解析到 rustfs 内网 IP（上传走内网，签名 host 仍为公网域名）
      - "storage.tabidachi.moe:${RUSTFS_INTERNAL_IP:-192.168.8.111}"
      - "host.docker.internal:host-gateway"
    environment:
      MEADOW_DEVELOPMENT: "false"
      MEADOW_DB_URL: ${MEADOW_DB_URL:-jdbc:postgresql://192.168.8.111:5432/meadow}
      MEADOW_DB_USER: ${MEADOW_DB_USER:-username}
      MEADOW_DB_PASSWORD: ${MEADOW_DB_PASSWORD:-password}
      MEADOW_JWT_SECRET: ${MEADOW_JWT_SECRET:?必须设置 MEADOW_JWT_SECRET}
      MEADOW_ENCRYPTION_SECRET: ${MEADOW_ENCRYPTION_SECRET:?必须设置 MEADOW_ENCRYPTION_SECRET}
      # Redis（宿主机内网）
      MEADOW_REDIS_HOST: ${MEADOW_REDIS_HOST:-192.168.8.111}
      MEADOW_REDIS_PASSWORD: ${MEADOW_REDIS_PASSWORD:-}
      # S3 / RustFS：连接与直链用同一公网域名（签名 host 一致）
      #   后端连接：http://storage.tabidachi.moe:9000（extra_hosts → 192.168.8.111:9000 内网直连 rustfs）
      #   浏览器直链：https://storage.tabidachi.moe:443（公网 frp 443 → 内网 9000）
      MEADOW_S3_HOST: ${MEADOW_S3_HOST:-storage.tabidachi.moe}
      MEADOW_S3_PORT: ${MEADOW_S3_PORT:-9000}
      MEADOW_S3_SCHEME: ${MEADOW_S3_SCHEME:-http}
      MEADOW_S3_PUBLIC_HOST: ${MEADOW_S3_PUBLIC_HOST:-storage.tabidachi.moe}
      MEADOW_S3_PUBLIC_PORT: ${MEADOW_S3_PUBLIC_PORT:-443}
      MEADOW_S3_PUBLIC_SCHEME: ${MEADOW_S3_PUBLIC_SCHEME:-https}
      MEADOW_S3_ACCESS_KEY: ${MEADOW_S3_ACCESS_KEY:?必须设置 MEADOW_S3_ACCESS_KEY}
      MEADOW_S3_SECRET_KEY: ${MEADOW_S3_SECRET_KEY:?必须设置 MEADOW_S3_SECRET_KEY}
      MEADOW_RESEND_API_KEY: ${MEADOW_RESEND_API_KEY:-}
    ports:
      - "23333:23333"
    restart: unless-stopped

  frontend:
    build:
      context: ../meadow-web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: meadow-frontend
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
