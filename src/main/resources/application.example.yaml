# ⚠️ 配置模板：复制为 application.yaml 后填入真实密钥，或通过环境变量注入。
# 生产环境必须通过环境变量注入全部密钥（MEADOW_JWT_SECRET / MEADOW_S3_* / MEADOW_REDIS_PASSWORD /
# MEADOW_RESEND_API_KEY / MEADOW_ENCRYPTION_SECRET）。本文件仅作模板，不得填入真实密钥。
ktor:
  # 开发环境默认 true（连 H2 测试库 + 测试邮件）；生产部署需显式设置 MEADOW_DEVELOPMENT=false
  development: "${MEADOW_DEVELOPMENT:true}"
  deployment:
    port: 23333
  application:
    modules:
      - moe.tabidachi.meadow.plugins.DIKt.configureDI
      - moe.tabidachi.meadow.plugins.SecurityKt.configureSecurity
      - moe.tabidachi.meadow.plugins.CORSKt.configureCORS
      - moe.tabidachi.meadow.plugins.MonitoringKt.configureMonitoring
      - moe.tabidachi.meadow.plugins.RateLimitKt.configureRateLimit
      - moe.tabidachi.meadow.plugins.SocketsKt.configureSockets
      - moe.tabidachi.meadow.plugins.RoutingKt.configureRouting
      - moe.tabidachi.meadow.plugins.SerializationKt.configureSerialization
      - moe.tabidachi.meadow.plugins.StatusPagesKt.configureStatusPages

jwt:
  name: "meadow-jwt"
  domain: "https://tabidachi.moe"
  audience: "tabidachi.moe"
  realm: "Meadow"
  secret: "${MEADOW_JWT_SECRET:CHANGE_ME}"
  issuer: "https://tabidachi.moe"

database:
  main:
    url: "${MEADOW_DB_URL:jdbc:postgresql://host.docker.internal:5440/meadow}"
    user: "${MEADOW_DB_USER:username}"
    driver: org.postgresql.Driver
    password: "${MEADOW_DB_PASSWORD:password}"
  test:
    url: "jdbc:h2:file:./.idea/h2/meadow"
    user: root
    driver: org.h2.Driver
    password: ""

argon2:
  iterations: 36
  memory: 65536
  parallelism: 1

s3:
  host: "${MEADOW_S3_HOST:storage.tabidachi.moe}"
  port: ${MEADOW_S3_PORT:-443}
  # https（默认，443 反代）或 http（自建 S3 直连，如 rustfs:9000）
  scheme: "${MEADOW_S3_SCHEME:-https}"
  # 公开访问地址（浏览器直链用；容器连内网 host 时必配，否则直链是内网地址）
  public_host: "${MEADOW_S3_PUBLIC_HOST:-}"
  public_port: ${MEADOW_S3_PUBLIC_PORT:-0}
  public_scheme: "${MEADOW_S3_PUBLIC_SCHEME:-}"
  access_key: "${MEADOW_S3_ACCESS_KEY:CHANGE_ME}"
  secret_key: "${MEADOW_S3_SECRET_KEY:CHANGE_ME}"

redis:
  host: "${MEADOW_REDIS_HOST:tabidachi.moe}"
  port: 6379
  username:
  password: "${MEADOW_REDIS_PASSWORD:CHANGE_ME}"

# CORS 允许的来源白名单：生产限定域名，开发环境留空表示允许任意来源
cors:
  allowed_hosts:
    - "https://meadow.tabidachi.moe"
    - "http://localhost:5173"
    - "http://localhost:4173"

resend:
  api_key: "${MEADOW_RESEND_API_KEY:CHANGE_ME}"

encryption:
  # AES-128 密钥：必须为 32 位十六进制（16 字节）；生产必须用环境变量覆盖
  secret_key: "${MEADOW_ENCRYPTION_SECRET:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb}"
