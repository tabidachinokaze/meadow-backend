[versions]
exposed = "1.3.0"
h2 = "2.4.240"
h2-r2dbc = "1.1.0.RELEASE"
koin = "4.2.2"
kotlin = "2.4.0"
logback = "1.5.35"
postgresql = "42.7.11"
argon2 = "2.12"
s3 = "1.6.106"
resend = "v4.17.0"
kedis = "0.0.13"

[libraries]
# exposed
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-r2dbc = { module = "org.jetbrains.exposed:exposed-r2dbc", version.ref = "exposed" }
exposed-crypt = { module = "org.jetbrains.exposed:exposed-crypt", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed" }
exposed-money = { module = "org.jetbrains.exposed:exposed-money", version.ref = "exposed" }
exposed-kotlin-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
# database
h2database-h2 = { module = "com.h2database:h2", version.ref = "h2" }
h2database-r2dbc = { module = "io.r2dbc:r2dbc-h2", version.ref = "h2-r2dbc" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
# koin
koin-ktor = { module = "io.insert-koin:koin-ktor", version.ref = "koin" }
koin-loggerSlf4j = { module = "io.insert-koin:koin-logger-slf4j", version.ref = "koin" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
argon2-jvm = { module = "de.mkammerer:argon2-jvm", version.ref = "argon2" }
s3 = { module = "aws.sdk.kotlin:s3", version.ref = "s3" }
resend-java = { module = "com.resend:resend-java", version.ref = "resend" }
kedis = { module = "io.github.domgew:kedis", version.ref = "kedis" }

[bundles]
exposed = [
    "exposed-core",
    "exposed-r2dbc",
    "exposed-crypt",
    "exposed-jdbc",
    "exposed-dao",
    "exposed-json",
    "exposed-money",
    "exposed-kotlin-datetime",
]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
